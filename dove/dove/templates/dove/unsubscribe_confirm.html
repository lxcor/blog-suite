{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Unsubscribe" %}</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 80px auto; padding: 0 20px; color: #333; }
        h1 { font-size: 1.4rem; }
        p { line-height: 1.6; }
        .email { font-weight: bold; }
        .btn { display: inline-block; padding: 10px 24px; background: #dc3545; color: #fff;
               border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .btn:hover { background: #c82333; }
        .cancel { margin-left: 12px; color: #666; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>{% trans "Unsubscribe" %}</h1>
    <p>{% blocktrans with email=email %}Are you sure you want to unsubscribe <span class="email">{{ email }}</span>?{% endblocktrans %}</p>
    <p>{% trans "You will no longer receive newsletters from this list." %}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn">{% trans "Confirm unsubscription" %}</button>
        <a href="/" class="cancel">{% trans "Back" %}</a>
    </form>
</body>
</html>
