[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lxcor-dove"
version = "0.1.0"
description = "Newsletter sender for Django — dispatches campaigns to subscribers collected by lxcor-postino"
license = { text = "MIT" }
authors = [{ name = "Alexandre Scozzafave Alves", email = "frontdesk@lxcor.com" }]
requires-python = ">=3.8"
keywords = ["django", "newsletter", "email", "blog"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "django>=4.2",
    "lxcor-postino>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/lxcor/blog-suite"
Repository = "https://github.com/lxcor/blog-suite"

[tool.setuptools.packages.find]
where = ["."]
include = ["dove*"]

[tool.setuptools.package-data]
"dove" = ["templates/**/*.html"]
