[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lxcor-postino"
version = "0.1.0"
description = "Self-contained Django blog app — content management with SEO and author profiles"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alexandre Scozzafave Alves", email = "frontdesk@lxcor.com" }]
requires-python = ">=3.8"
keywords = ["django", "blog", "cms", "seo"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "django>=4.2",
    "Pillow>=10.0",
]

[project.optional-dependencies]
search = ["psycopg2>=2.9"]

[project.urls]
Homepage = "https://github.com/lxcor/blog-suite"
Repository = "https://github.com/lxcor/blog-suite"

[tool.setuptools.packages.find]
where = ["."]
include = ["postino*"]

[tool.setuptools.package-data]
"postino" = ["templates/**/*.html", "locale/**/*"]
